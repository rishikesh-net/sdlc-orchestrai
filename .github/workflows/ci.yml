name: ci

# Cross-platform guardrail for the single-runtime migration.
# Phase 0 goal: prove the same Python test suite runs on Windows, macOS, and Linux.
# After Phase 4 there are no runtime shell scripts in the pack (launchers are optional).
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest discover -s scripts/tests -v
