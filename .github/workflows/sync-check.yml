name: skills-sync-check
on:
  pull_request:
    paths:
      - "skills/**"
      - ".sdlc/**"
      - "docs/requirements/**"
      - "scripts/**"
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify skill sync generation
        run: |
          python scripts/sdlc.py sync-skills
          python scripts/sdlc.py sync-skills --check
      - name: Shared memory is well-formed
        run: python scripts/sdlc.py validate
      - name: Run Python unit tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Requirements packs are well-formed
        run: |
          shopt -s nullglob
          for pack in docs/requirements/*/pack.json; do
            feature="$(basename "$(dirname "$pack")")"
            bash skills/sdlc-requirements-analyzer/scripts/req-index.sh validate --feature "$feature"
          done
