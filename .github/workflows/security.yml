# Security backstop: the same classes of checks the sdlc-security-review skill uses, enforced in CI.
# Adjust: .NET version, working directories, and whether to block merges (branch protection).
# Pin third-party actions to commit SHAs for stricter supply-chain security.
#
# Language auto-detection: the CodeQL matrix runs only for languages that actually have committed
# source (C#, JavaScript/TypeScript, Python). This keeps the workflow green in the framework repo
# (Python + shell only) while remaining a copy-paste template for downstream .NET/React apps.
#
# Code Scanning (inline annotations in Security > Code scanning) requires GitHub Advanced Security
# on private repos (free on public repos). When it is unavailable, SARIF is still saved as a workflow
# artifact and the upload steps are non-fatal, so the run stays green.
name: security
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"   # weekly
permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      languages: ${{ steps.d.outputs.languages }}
    steps:
      - uses: actions/checkout@v4
      - id: d
        name: Detect committed source languages
        run: |
          langs=()
          git ls-files '*.cs' '*.sln' '*.csproj' | grep -vE '\.example\.cs$' | grep -q . && langs+=("csharp")
          git ls-files '*.ts' '*.tsx' '*.js' '*.jsx' 'package.json' | grep -vE '\.example\.(ts|tsx)$' | grep -q . && langs+=("javascript-typescript")
          git ls-files '*.py' | grep -q . && langs+=("python")
          json='[]'
          if [[ ${#langs[@]} -gt 0 ]]; then
            json="[$(printf '%s\n' "${langs[@]}" | sed 's/.*/"&"/' | paste -sd, -)]"
          fi
          echo "Detected CodeQL languages: $json"
          echo "languages=$json" >> "$GITHUB_OUTPUT"

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read   # gitleaks-action lists PR commits on pull_request events
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}   # required for some org plans

  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x          # TODO: set to your project's SDK version
      - uses: actions/setup-node@v4
        with:
          node-version: 20               # TODO: set to your frontend's Node version
      - name: Vulnerable dependencies (NuGet + npm)
        run: SDLC_STRICT=1 bash skills/sdlc-security-review/scripts/scan-deps.sh

  # Publishes SARIF from the same scripts agents run locally. Findings land in Security > Code
  # scanning for triage when available; otherwise the SARIF is kept as a workflow artifact.
  # CodeQL below remains the primary SAST gate.
  scans:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SARIF converter tests
        run: python -m unittest discover -s scripts/tests -v
      - name: Install scanners
        run: pip install semgrep zizmor
      - name: Run security scanners
        continue-on-error: true
        run: bash skills/sdlc-security-review/scripts/scan-all.sh --feature ci
      - name: Save SARIF report (artifact)
        if: always() && hashFiles('.sdlc/reports/ci-findings.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-scans-sarif
          path: |
            .sdlc/reports/ci-findings.sarif
            .sdlc/reports/ci-findings.json
          if-no-files-found: ignore
      - name: Upload SARIF to Code Scanning
        if: always() && hashFiles('.sdlc/reports/ci-findings.sarif') != ''
        continue-on-error: true   # no-op failure when Code Scanning is unavailable (private, no GHAS)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .sdlc/reports/ci-findings.sarif
          category: sdlc-scanners


  codeql:
    needs: detect
    if: needs.detect.outputs.languages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.detect.outputs.languages) }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.language == 'csharp'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x          # TODO: set to your project's SDK version
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3
        if: matrix.language == 'csharp'
      # Analyze without uploading so real build/analysis failures stay fatal even when Code Scanning
      # is unavailable; the SARIF is written to disk and published below.
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: false
          output: ${{ github.workspace }}/codeql-${{ matrix.language }}.sarif
      - name: Save CodeQL SARIF (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeql-${{ matrix.language }}-sarif
          path: codeql-${{ matrix.language }}.sarif
          if-no-files-found: ignore
      - name: Upload SARIF to Code Scanning
        if: always()
        continue-on-error: true   # no-op failure when Code Scanning is unavailable (private, no GHAS)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: codeql-${{ matrix.language }}.sarif
          category: "/language:${{ matrix.language }}"

  iac:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy IaC & config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: node_modules,.git,.sdlc,bin,obj,dist,build
      - name: Save Trivy SARIF (artifact)
        if: always() && hashFiles('trivy-iac.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: trivy-iac-sarif
          path: trivy-iac.sarif
          if-no-files-found: ignore
      - name: Upload Trivy SARIF to Code Scanning
        if: always() && hashFiles('trivy-iac.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac
